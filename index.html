<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17365d">
  <title>理财净值观测</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--blue:#17365d;--line:#e5e7eb;--up:#c62828;--down:#16803c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text)}
    main{max-width:680px;margin:auto;padding:18px 14px 36px}.head{background:linear-gradient(135deg,#17365d,#2f75b5);color:#fff;border-radius:18px;padding:20px 18px;box-shadow:0 8px 22px rgba(23,54,93,.18)}
    h1{font-size:24px;margin:0 0 8px}.sub{font-size:13px;opacity:.85}.list{display:grid;gap:12px;margin-top:14px}.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 3px 12px rgba(15,23,42,.06);border:1px solid #eef1f5}
    .name{font-size:17px;font-weight:700;margin-bottom:3px}.code{font-size:12px;color:var(--muted)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.metric{background:#f7f9fc;border-radius:12px;padding:11px}.label{font-size:12px;color:var(--muted);margin-bottom:5px}.value{font-size:20px;font-weight:750}.date{font-size:12px;color:var(--muted);margin-top:11px}.up{color:var(--up)}.down{color:var(--down)}.notice{margin-top:14px;font-size:12px;line-height:1.65;color:var(--muted);padding:0 3px}.status{text-align:center;padding:28px;color:var(--muted)}button{margin-top:12px;border:0;background:#fff;color:var(--blue);border-radius:10px;padding:8px 12px;font-weight:650}
    @media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#172033;--text:#f3f4f6;--muted:#a7b0c0;--line:#2b354a}.card{border-color:#253047}.metric{background:#202b40}.head{box-shadow:none}}
  </style>
</head>
<body>
<main>
  <section class="head"><h1>理财净值观测</h1><div class="sub" id="updated">正在读取数据…</div><button type="button" onclick="location.reload()">刷新</button></section>
  <section class="list" id="list"><div class="status">正在加载产品净值…</div></section>
  <div class="notice">数据来自公开披露渠道整理，仅用于个人查阅与对照，不构成投资建议。请以产品管理人正式披露为准。“万收”表示相邻净值点每万元变化，两个净值点之间可能跨越多个自然日。</div>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
fetch('nav_data.json?ts='+Date.now(),{cache:'no-store'})
.then(r=>{if(!r.ok)throw new Error('读取失败');return r.json()})
.then(data=>{
 document.getElementById('updated').textContent='数据日期：'+(data.updated_at||'未记录');
 const ps=Array.isArray(data.products)?data.products:[];
 document.getElementById('list').innerHTML=ps.length?ps.map(p=>{
   const w=Number(p.wan_return);const cls=w>0?'up':w<0?'down':'';const sign=w>0?'+':'';
   return `<article class="card"><div class="name">${esc(p.name)}</div><div class="code">份额代码：${esc(p.share_code)}</div><div class="row"><div class="metric"><div class="label">单位净值</div><div class="value">${Number(p.unit_nav).toFixed(6)}</div></div><div class="metric"><div class="label">相邻净值点万收</div><div class="value ${cls}">${sign}${w.toFixed(2)} 元</div></div></div><div class="date">净值日期：${esc(p.nav_date)}</div></article>`
 }).join(''):'<div class="status">暂无产品数据</div>';
}).catch(()=>{
 document.getElementById('updated').textContent='数据读取失败';
 document.getElementById('list').innerHTML='<div class="status">没有读取到 nav_data.json，请检查文件是否已上传。</div>';
});
</script>
</body>
</html>
