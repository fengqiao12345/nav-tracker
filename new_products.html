<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#17365d"
  >

  <title>哪吒攒钱｜北京银行新品</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 18px 14px 40px;
    }

    .header {
      padding: 21px 18px;
      color: white;
      background:
        linear-gradient(
          135deg,
          #17365d,
          #2f75b5
        );
      border-radius: 18px;
      box-shadow:
        0 8px 22px
        rgba(23,54,93,0.18);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .sub {
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.9;
    }

    .nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .nav a {
      padding: 11px;
      border-radius: 11px;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .nav .home {
      background: white;
      color: #17365d;
      border: 1px solid #dce4ef;
    }

    .nav .current {
      background: #17365d;
      color: white;
    }

    .list {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .card {
      position: relative;
      padding: 17px;
      background: white;
      border: 1px solid #eef1f5;
      border-radius: 16px;
      box-shadow:
        0 3px 12px
        rgba(15,23,42,0.06);
    }

    .new-tag {
      display: inline-block;
      margin-bottom: 10px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #fff1f1;
      color: #c62828;
      font-size: 12px;
      font-weight: 700;
    }

    h2 {
      margin: 0 0 5px;
      font-size: 18px;
    }

    .code {
      color: #6b7280;
      font-size: 12px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 14px;
    }

    .info-item {
      padding: 10px;
      background: #f7f9fc;
      border-radius: 11px;
    }

    .info-item span {
      display: block;
      margin-bottom: 5px;
      color: #6b7280;
      font-size: 12px;
    }

    .info-item strong {
      font-size: 14px;
    }

    .first-seen {
      margin-top: 12px;
      color: #6b7280;
      font-size: 12px;
    }

    .empty {
      margin-top: 14px;
      padding: 42px 20px;
      background: white;
      border-radius: 16px;
      text-align: center;
      border: 1px solid #eef1f5;
    }

    .empty-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #e8f7ec;
      color: #16803c;
      font-size: 25px;
      line-height: 44px;
      font-weight: 700;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 700;
    }

    .empty-text {
      margin-top: 8px;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.7;
    }

    .notice {
      margin-top: 15px;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main>
    <section class="header">
      <h1>北京银行新品</h1>

      <div class="sub">
        只监测北京银行公开产品列表中新出现的
        北银理财人民币产品。<br>
        最近更新：2026-10-30T01:24:28+00:00
      </div>
    </section>

    <nav class="nav">
      <a
        class="home"
        href="index.html">
        净值追踪
      </a>

      <a
        class="current"
        href="new_products.html">
        新品监测
      </a>
    </nav>

    <section class="list">
      
      
        <div class="empty">
          <div class="empty-icon">✓</div>
          <div class="empty-title">
            暂无新上架产品
          </div>
          <div class="empty-text">
            已完成当前产品基准建立。<br>
            后续北京银行新出现的北银理财人民币产品，
            将自动显示在这里。
          </div>
        </div>
        
    </section>

    <div class="notice">
      说明：本页面所称“新品”，是指程序首次监测到
      该产品出现在北京银行公开产品列表中，
      不代表该产品仅由北京银行独家销售，
      也不代表产品当日正式成立。
      实际销售信息以北京银行APP及正式销售文件为准。
    </div>
  </main>
</body>
</html>
