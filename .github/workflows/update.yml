name: 每天更新理财净值

on:
  schedule:
    # 北京时间每天08:00运行
    - cron: "0 0 * * *"

    # 北京时间每天10:00补查
    - cron: "0 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装运行组件
        run: pip install -r requirements.txt

      - name: 获取并更新净值
        run: python update_nav.py

      - name: 保存更新结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html nav_history.json
          git diff --cached --quiet || git commit -m "自动更新理财净值"
          git push
