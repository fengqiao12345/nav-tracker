name: build

on:
  push:
    branches:
      - main

  schedule:
    # 北京时间 00:00-08:00 每小时运行一次
    # UTC: 16:00-23:00 和 00:00
    - cron: '0 16-23,0 * * *'

    # 北京时间 08:30、08:45
    - cron: '30,45 0 * * *'

    # 北京时间 09:00-09:30 每5分钟运行一次
    - cron: '0-30/5 1 * * *'

    # 北京时间 10:00 再补跑一次
    - cron: '0 2 * * *'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium

      - name: Run script
        run: |
          python update_nav.py

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
